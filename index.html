<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>러스트 액자 이미지 도구</title>
<style>
:root {
  --bg: #17181a;
  --panel: #202225;
  --rust: #c9622a;
  --rust-bright: #e07b3a;
  --border: #3a3d42;
  --text: #d8d8d4;
  --text-dim: #8a8d92;
}

body {
  font-family: 'Consolas', 'Courier New', monospace;
  background:
    radial-gradient(circle at 50% -10%, #2a2c2f 0%, var(--bg) 60%);
  color: var(--text);
  text-align: center;
  padding: 24px 16px;
  letter-spacing: 0.3px;
}

h2 {
  color: var(--rust-bright);
  text-transform: uppercase;
  font-size: 15px;
  letter-spacing: 2px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  margin: 32px auto 16px;
  max-width: 480px;
  position: relative;
}
h2::before, h2::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 6px; height: 6px;
  background: var(--rust);
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px #00000055;
}

#stage {
  background: #0c0d0e;
  border: 2px solid var(--border);
  outline: 1px solid #00000080;
  position: relative;
}

.row { margin: 12px 0; }

button {
  background: linear-gradient(180deg, #2a2c2f, #1c1d1f);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 9px 16px;
  font-size: 13px;
  font-family: inherit;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
button:hover {
  border-color: var(--rust);
  color: var(--rust-bright);
}
button:active { transform: translateY(1px); }

input[type=text] {
  background: #0c0d0e;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  font-family: inherit;
  font-size: 13px;
  border-radius: 2px;
}
input[type=text]:focus {
  outline: none;
  border-color: var(--rust);
}

input[type=file] {
  color: var(--text-dim);
  font-size: 13px;
}

label {
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 2px;
  background: var(--panel);
  cursor: pointer;
  font-size: 13px;
}

#result {
  margin-top: 16px;
  border: 1px solid var(--border);
  background: var(--panel);
  display: inline-block;
  padding: 16px 20px;
  border-radius: 2px;
  position: relative;
}
#result::before, #result::after,
#urlBox::before, #urlBox::after {
  content: "";
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #6b6b6b, #2b2b2b);
  box-shadow: 0 0 0 1px #000;
}
#result::before { top: 6px; left: 6px; }
#result::after  { top: 6px; right: 6px; }

#result img {
  border: 1px solid var(--rust);
  max-width: 300px;
  display: block;
  margin: 10px auto;
}

#urlBox {
  background: #0c0d0e;
  border: 1px solid var(--rust);
  padding: 14px 18px;
  border-radius: 2px;
  display: inline-block;
  margin-top: 12px;
  position: relative;
}
#urlBox input {
  width: 320px;
  margin-right: 8px;
}

small { color: var(--text-dim); }
#status { color: var(--rust-bright); }
</style>
</head>
<body>

<h2>1. 이미지 붙여넣기</h2>
<div class="row">
  <input type="file" id="fileInput" accept="image/*">
</div>
<div class="row">
  <input type="text" id="urlInput" placeholder="이미지 주소 붙여넣기" size="40">
  <button id="urlBtn">이 주소 불러오기</button>
</div>
<div class="row">
  <small>사각형 위를 클릭한 뒤, Win+Shift+S로 캡처하고 Ctrl+V 하면 붙여넣기 됩니다</small>
</div>
<div id="status"></div>

<h2>2. 액자 종류 선택 &amp; 잘라낼 영역 자유롭게 드래그 (선택 안 해도 됨)</h2>
<div class="row">
  <label><input type="radio" name="frame" value="XL" checked> XL</label>
  <label style="margin-left:20px"><input type="radio" name="frame" value="XXL"> XXL (업로드시 왼쪽으로 90도 회전)</label>
</div>

<canvas id="stage" width="500" height="500"></canvas>
<div class="row">
  <small>빈 곳을 드래그 → 새로 선택(비율 자유) / 모서리 드래그 → 크기 조절 / 안쪽 드래그 → 이동</small>
</div>
<div class="row">
  <button id="clearBtn">선택 초기화 (원본 전체 사용)</button>
</div>

<h2>3. 업로드</h2>
<div class="row">
  <button id="exportBtn">이미지 만들기 + 업로드</button>
</div>
<div id="result"></div>

<script>
const WORKER_URL = "https://rust-sil-worker.shachito.workers.dev";

const DISPLAY = 500;
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
const fileInput = document.getElementById('fileInput');
const urlInput = document.getElementById('urlInput');
const urlBtn = document.getElementById('urlBtn');
const clearBtn = document.getElementById('clearBtn');
const exportBtn = document.getElementById('exportBtn');
const resultDiv = document.getElementById('result');
const statusDiv = document.getElementById('status');
const frameRadios = document.getElementsByName('frame');

let frame = 'XL';
let img = null;

let drawX=0, drawY=0, drawW=0, drawH=0, dispScale=1;
let box = null;

const HANDLE = 10;
let mode = null;
let resizeCorner = null;
let startPtImg = {x:0,y:0};
let boxStart = null;

frameRadios.forEach(r => r.addEventListener('change', e => { frame = e.target.value; }));

function loadImage(src){
  const image = new Image();
  image.crossOrigin = 'anonymous';
  image.onload = () => {
    img = image;
    fitDisplay();
    box = null;
    draw();
    statusDiv.textContent = '';
  };
  image.onerror = () => {
    statusDiv.textContent = '';
    alert('이미지를 불러오지 못했습니다.');
  };
  image.src = src;
}

function fitDisplay(){
  dispScale = Math.min(DISPLAY/img.width, DISPLAY/img.height);
  drawW = img.width*dispScale; drawH = img.height*dispScale;
  drawX = (DISPLAY-drawW)/2; drawY = (DISPLAY-drawH)/2;
}

function toImgCoord(px, py){
  return { x: (px-drawX)/dispScale, y: (py-drawY)/dispScale };
}
function toScreen(ix, iy){
  return { x: drawX+ix*dispScale, y: drawY+iy*dispScale };
}

function clampBoxToImage(b){
  if (b.x < 0){ b.w += b.x; b.x = 0; }
  if (b.y < 0){ b.h += b.y; b.y = 0; }
  if (b.x+b.w > img.width) b.w = img.width-b.x;
  if (b.y+b.h > img.height) b.h = img.height-b.y;
  return b;
}

function draw(){
  ctx.clearRect(0,0,DISPLAY,DISPLAY);
  if (!img) return;
  ctx.drawImage(img, drawX, drawY, drawW, drawH);
  if (!box) return;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  const s = toScreen(box.x, box.y);
  const bw = box.w*dispScale, bh = box.h*dispScale;
  ctx.beginPath();
  ctx.rect(0,0,DISPLAY,DISPLAY);
  ctx.rect(s.x, s.y, bw, bh);
  ctx.fill('evenodd');
  ctx.restore();

  ctx.strokeStyle = '#6c6';
  ctx.lineWidth = 2;
  ctx.strokeRect(s.x, s.y, bw, bh);

  ctx.fillStyle = '#6c6';
  [[s.x,s.y],[s.x+bw,s.y],[s.x,s.y+bh],[s.x+bw,s.y+bh]].forEach(p=>{
    ctx.fillRect(p[0]-HANDLE/2, p[1]-HANDLE/2, HANDLE, HANDLE);
  });
}

function hitCorner(px, py){
  if (!box) return null;
  const s = toScreen(box.x, box.y);
  const bw = box.w*dispScale, bh = box.h*dispScale;
  const corners = { tl:[s.x,s.y], tr:[s.x+bw,s.y], bl:[s.x,s.y+bh], br:[s.x+bw,s.y+bh] };
  for (const k in corners){
    const [cx,cy] = corners[k];
    if (Math.abs(px-cx)<HANDLE && Math.abs(py-cy)<HANDLE) return k;
  }
  return null;
}

function insideBox(px, py){
  if (!box) return false;
  const s = toScreen(box.x, box.y);
  const bw = box.w*dispScale, bh = box.h*dispScale;
  return px>=s.x && px<=s.x+bw && py>=s.y && py<=s.y+bh;
}

stage.addEventListener('pointerdown', e => {
  if (!img) return;
  const rect = stage.getBoundingClientRect();
  const px = e.clientX-rect.left, py = e.clientY-rect.top;
  const corner = hitCorner(px, py);
  const ip = toImgCoord(px, py);

  if (corner){
    mode = 'resize'; resizeCorner = corner;
    boxStart = {...box};
  } else if (insideBox(px, py)){
    mode = 'move';
    boxStart = {...box};
    startPtImg = ip;
  } else {
    mode = 'create';
    startPtImg = ip;
    box = {x:ip.x, y:ip.y, w:0, h:0};
  }
});

window.addEventListener('pointermove', e => {
  if (!mode || !img) return;
  const rect = stage.getBoundingClientRect();
  const px = e.clientX-rect.left, py = e.clientY-rect.top;
  const ip = toImgCoord(px, py);

  if (mode === 'create'){
    box = {
      x: Math.min(startPtImg.x, ip.x),
      y: Math.min(startPtImg.y, ip.y),
      w: Math.abs(ip.x - startPtImg.x),
      h: Math.abs(ip.y - startPtImg.y)
    };
    clampBoxToImage(box);
  }
  else if (mode === 'move'){
    const dx = ip.x - startPtImg.x, dy = ip.y - startPtImg.y;
    box = {x: boxStart.x+dx, y: boxStart.y+dy, w: boxStart.w, h: boxStart.h};
    clampBoxToImage(box);
  }
  else if (mode === 'resize'){
    let anchor;
    if (resizeCorner==='br') anchor = {x:boxStart.x, y:boxStart.y};
    if (resizeCorner==='bl') anchor = {x:boxStart.x+boxStart.w, y:boxStart.y};
    if (resizeCorner==='tr') anchor = {x:boxStart.x, y:boxStart.y+boxStart.h};
    if (resizeCorner==='tl') anchor = {x:boxStart.x+boxStart.w, y:boxStart.y+boxStart.h};

    box = {
      x: Math.min(anchor.x, ip.x),
      y: Math.min(anchor.y, ip.y),
      w: Math.abs(ip.x - anchor.x),
      h: Math.abs(ip.y - anchor.y)
    };
    clampBoxToImage(box);
  }
  draw();
});

window.addEventListener('pointerup', () => { mode = null; });

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) loadImage(URL.createObjectURL(file));
});

// URL 불러오기: Worker 프록시를 거쳐서 CORS 문제 없이 불러옴
urlBtn.addEventListener('click', () => {
  const target = urlInput.value.trim();
  if (!target) return;
  statusDiv.textContent = '이미지 불러오는 중...';
  const proxied = `${WORKER_URL}/fetch-image?url=${encodeURIComponent(target)}`;
  loadImage(proxied);
});

stage.tabIndex = 0;
stage.addEventListener('click', () => stage.focus());
document.addEventListener('paste', e => {
  const items = e.clipboardData.items;
  for (const item of items){
    if (item.type.startsWith('image/')){
      loadImage(URL.createObjectURL(item.getAsFile()));
    }
  }
});

clearBtn.addEventListener('click', () => { box = null; draw(); });

exportBtn.addEventListener('click', () => {
  if (!img){ alert('먼저 이미지를 넣어주세요.'); return; }

  let out;
  if (box && box.w > 0 && box.h > 0){
    out = document.createElement('canvas');
    out.width = Math.round(box.w); out.height = Math.round(box.h);
    out.getContext('2d').drawImage(img, box.x, box.y, box.w, box.h, 0, 0, out.width, out.height);
  } else {
    out = document.createElement('canvas');
    out.width = img.width; out.height = img.height;
    out.getContext('2d').drawImage(img, 0, 0);
  }

  let finalCanvas = out;
  if (frame === 'XXL'){
    const rot = document.createElement('canvas');
    rot.width = out.height; rot.height = out.width;
    const rctx = rot.getContext('2d');
    rctx.translate(rot.width/2, rot.height/2);
    rctx.rotate(-90 * Math.PI/180);
    rctx.drawImage(out, -out.width/2, -out.height/2);
    finalCanvas = rot;
  }

  finalCanvas.toBlob(async blob => {
    resultDiv.innerHTML = '<p>업로드 중...</p>';
    try {
      const resp = await fetch(`${WORKER_URL}/upload`, {
        method: 'POST',
        headers: { 'Content-Type': 'image/jpeg' },
        body: blob
      });
      if (!resp.ok) throw new Error('업로드 실패');
      const data = await resp.json();
      const sil = `/sil ${data.url}`;

      resultDiv.innerHTML = `
        <p>완성! (${(blob.size/1024).toFixed(0)} KB, ${finalCanvas.width}x${finalCanvas.height}) — 30분 뒤 자동 삭제됩니다</p>
        <img src="${data.url}">
        <div id="urlBox">
          <input type="text" id="urlText" value="${sil}" readonly>
          <button id="copyBtn">복사</button>
        </div>
      `;
      document.getElementById('copyBtn').addEventListener('click', () => {
        const txt = document.getElementById('urlText');
        txt.select();
        navigator.clipboard.writeText(txt.value).then(() => {
          document.getElementById('copyBtn').textContent = '복사됨!';
        });
      });
    } catch (err) {
      resultDiv.innerHTML = `<p style="color:#f66;">업로드 실패: ${err.message}</p>`;
    }
  }, 'image/jpeg', 0.92);
});
</script>
</body>
</html>
